<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contractor Escrow – Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Contractor Escrow</h1>
        <p id="user-info" class="text-sm text-gray-500"></p>
      </div>
      <button id="logout-btn"
              class="text-sm text-red-600 hover:text-red-800 font-medium">
        Sign Out
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <!-- Create Job Section -->
    <section id="create-job-section" class="mb-10 hidden">
      <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="text-lg font-semibold mb-4">Create New Job Contract</h2>
        <form id="create-job-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Recipient Unique ID (5-character code)</label>
            <input type="text" id="job-recipient-code" required maxlength="5"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 uppercase outline-none font-mono"
                   placeholder="e.g. A4F9X" />
            <p class="text-xs text-gray-400 mt-1">Enter the 5-character ID of the client or contractor you are contracting with.</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Job Title / Description</label>
            <textarea id="job-description" rows="3" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                      placeholder="e.g. Install new electrical panel and rewire kitchen"></textarea>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Amount</label>
              <input type="number" id="job-amount" min="1" step="0.01" required
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Currency</label>
              <select id="job-currency" required
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
              </select>
            </div>
          </div>
          <button type="submit"
                  class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
            Create & Send Contract
          </button>
        </form>
      </div>
    </section>

    <!-- Jobs List -->
    <section>
      <h2 class="text-lg font-semibold mb-4">Your Jobs</h2>
      <div id="jobs-list" class="space-y-4">
        <p class="text-gray-500">Loading jobs...</p>
      </div>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyChaJ8V0RulhBVu7EYZq9Kh6mswAIADADw",
      authDomain: "dolaz-9e25e.firebaseapp.com",
      projectId: "dolaz-9e25e",
      storageBucket: "dolaz-9e25e.firebasestorage.app",
      messagingSenderId: "213063237801",
      appId: "1:213063237801:web:10134ff68f17229362a9b8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let userProfile = null;

    // ========== AUTH GUARD ==========
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'index.html';
        return;
      }
      currentUser = user;

      const doc = await db.collection('users').doc(user.uid).get();
      userProfile = doc.data();

      document.getElementById('user-info').textContent =
        `${userProfile.name} (${userProfile.role}) · ID: ${userProfile.code}`;

      document.getElementById('create-job-section').classList.remove('hidden');
      loadJobs();
    });

    // ========== LOGOUT ==========
    document.getElementById('logout-btn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = 'index.html';
      });
    });

    // ========== CREATE JOB WITH RECIPIENT LOOKUP ==========
    document.getElementById('create-job-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const recipientCode = document.getElementById('job-recipient-code').value.trim().toUpperCase();
      const description = document.getElementById('job-description').value;
      const amount = parseFloat(document.getElementById('job-amount').value);
      const currency = document.getElementById('job-currency').value;

      if (recipientCode === userProfile.code) {
        alert('You cannot create a contract with yourself.');
        return;
      }

      try {
        // Look up recipient by their unique 5-char code
        const userQuery = await db.collection('users').where('code', '==', recipientCode).get();
        
        if (userQuery.empty) {
          alert('Recipient ID not found. Please check the code and try again.');
          return;
        }

        const recipientDoc = userQuery.docs[0];
        const recipientId = recipientDoc.id;
        const recipientData = recipientDoc.data();

        // Assign client and contractor IDs based on roles
        let clientId, clientName, contractorId, contractorName;

        if (userProfile.role === 'client') {
          clientId = currentUser.uid;
          clientName = userProfile.name;
          contractorId = recipientId;
          contractorName = recipientData.name;
        } else {
          clientId = recipientId;
          clientName = recipientData.name;
          contractorId = currentUser.uid;
          contractorName = userProfile.name;
        }

        await db.collection('jobs').add({
          clientId,
          clientName,
          contractorId,
          contractorName,
          description,
          amount,
          currency,
          status: 'proposed', // proposed → accepted → funded → completed → released / disputed
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('create-job-form').reset();
        loadJobs();
        alert('Contract created and sent successfully!');
      } catch (err) {
        alert('Error creating job: ' + err.message);
      }
    });

    // ========== LOAD JOBS (Targeted Queries) ==========
    async function loadJobs() {
      const jobsList = document.getElementById('jobs-list');
      jobsList.innerHTML = '<p class="text-gray-500">Loading jobs...</p>';
    
      try {
        // Query jobs where the user is the client
        const clientJobs = await db.collection('jobs')
          .where('clientId', '==', currentUser.uid)
          .get();

        // Query jobs where the user is the contractor
        const contractorJobs = await db.collection('jobs')
          .where('contractorId', '==', currentUser.uid)
          .get();
    
        // Merge and remove duplicates
        const jobsMap = new Map();
        clientJobs.forEach(doc => jobsMap.set(doc.id, doc));
        contractorJobs.forEach(doc => jobsMap.set(doc.id, doc));
        
        const docs = Array.from(jobsMap.values());
        
        // Sort descending by createdAt manually if needed, or let query handle it
        docs.sort((a, b) => {
          const timeA = a.data().createdAt?.toMillis() || 0;
          const timeB = b.data().createdAt?.toMillis() || 0;
          return timeB - timeA;
        });

        if (docs.length === 0) {
          jobsList.innerHTML = '<p class="text-gray-500">No jobs yet.</p>';
          return;
        }
    
        jobsList.innerHTML = '';
    
        docs.forEach(doc => {
          const job = doc.data();
          const jobId = doc.id;
    
          const card = document.createElement('div');
          card.className = 'bg-white rounded-xl shadow-sm border p-5';
    
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-medium text-gray-900">${job.description.substring(0, 80)}${job.description.length > 80 ? '...' : ''}</h3>
                <p class="text-sm text-gray-500 mt-1">
                  ${job.amount} ${job.currency} · 
                  <span class="capitalize font-medium">${job.status}</span>
                </p>
                <p class="text-xs text-gray-400 mt-1">Client: ${job.clientName} · Contractor: ${job.contractorName || 'Pending Assignment'}</p>
              </div>
              <div class="text-right text-sm text-gray-400">
                ${job.createdAt?.toDate().toLocaleDateString() || ''}
              </div>
            </div>
    
            <div class="mt-4 flex gap-2 flex-wrap">
              ${renderActionButtons(job, jobId)}
            </div>
          `;
    
          jobsList.appendChild(card);
        });
    
      } catch (err) {
        console.error('Error loading jobs:', err);
        jobsList.innerHTML = `
          <div class="bg-red-50 text-red-700 p-4 rounded-lg">
            <p class="font-medium">Error loading jobs</p>
            <p class="text-sm mt-1">${err.message}</p>
          </div>
        `;
      }
    }

    function renderActionButtons(job, jobId) {
      const role = userProfile.role;

      if (job.status === 'proposed' && role === 'contractor' && job.contractorId === currentUser.uid) {
        return `<button onclick="acceptJob('${jobId}')" class="px-4 py-1.5 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700">Accept Contract</button>`;
      }

      if (job.status === 'accepted' && job.clientId === currentUser.uid) {
        return `<button onclick="fundJob('${jobId}')" class="px-4 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">Fund Job (Bank Transfer)</button>`;
      }

      if (job.status === 'funded' && job.contractorId === currentUser.uid) {
        return `<button onclick="markComplete('${jobId}')" class="px-4 py-1.5 bg-indigo-600 text-white text-sm rounded-lg hover:bg-indigo-700">Mark as Complete</button>`;
      }

      if (job.status === 'completed' && job.clientId === currentUser.uid) {
        return `
          <button onclick="approveComplete('${jobId}')" class="px-4 py-1.5 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700">Approve & Release</button>
          <button onclick="raiseDispute('${jobId}')" class="px-4 py-1.5 bg-red-100 text-red-700 text-sm rounded-lg hover:bg-red-200">Raise Dispute</button>
        `;
      }

      if (['funded', 'completed'].includes(job.status)) {
        return `<button onclick="raiseDispute('${jobId}')" class="px-4 py-1.5 bg-red-100 text-red-700 text-sm rounded-lg hover:bg-red-200">Raise Dispute</button>`;
      }

      return `<span class="text-sm text-gray-400">Waiting for other party</span>`;
    }

    // ========== ACTION HANDLERS ==========
    window.acceptJob = async (jobId) => {
      await db.collection('jobs').doc(jobId).update({
        status: 'accepted',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      loadJobs();
    };

    window.fundJob = async (jobId) => {
      alert('In the next step we will show the bank transfer details (IBAN / ACH).\n\nFor now the status will just move to "funded".');
      await db.collection('jobs').doc(jobId).update({
        status: 'funded',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      loadJobs();
    };

    window.markComplete = async (jobId) => {
      await db.collection('jobs').doc(jobId).update({
        status: 'completed',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      loadJobs();
    };

    window.approveComplete = async (jobId) => {
      await db.collection('jobs').doc(jobId).update({
        status: 'released',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      loadJobs();
    };

    window.raiseDispute = async (jobId) => {
      const reason = prompt('Please briefly describe the issue:');
      if (!reason) return;

      await db.collection('jobs').doc(jobId).update({
        status: 'disputed',
        disputeReason: reason,
        disputedBy: currentUser.uid,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      loadJobs();
      alert('Dispute raised. Our specialists will review it within a few days.');
    };
  </script>
</body>
</html>
