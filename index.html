<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contractor Escrow – Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Contractor Escrow</h1>
      <p class="text-gray-500 mt-1">Secure payments for tradespeople</p>
    </div>

    <!-- Tabs -->
    <div class="flex mb-6 border-b">
      <button id="tab-signin" class="flex-1 py-2 font-medium text-blue-600 border-b-2 border-blue-600">
        Sign In
      </button>
      <button id="tab-signup" class="flex-1 py-2 font-medium text-gray-500">
        Create Account
      </button>
    </div>

    <!-- Sign In Form -->
    <form id="signin-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="signin-email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="signin-password" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
      </div>
      <button type="submit"
              class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
        Sign In
      </button>
    </form>

    <!-- Sign Up Form (hidden by default) -->
    <form id="signup-form" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input type="text" id="signup-name" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="signup-email" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="signup-password" required minlength="6"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">I am a...</label>
        <select id="signup-role" required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
          <option value="">Select role</option>
          <option value="client">Client / Property Owner</option>
          <option value="contractor">Contractor / Tradesperson</option>
        </select>
      </div>
      <button type="submit"
              class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
        Create Account
      </button>
    </form>

    <p id="auth-error" class="mt-4 text-sm text-red-600 hidden"></p>
  </div>

  <script>
    // ========== FIREBASE CONFIG ==========
    // Replace with your own Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyChaJ8V0RulhBVu7EYZq9Kh6mswAIADADw",
      authDomain: "dolaz-9e25e.firebaseapp.com",
      projectId: "dolaz-9e25e",
      storageBucket: "dolaz-9e25e.firebasestorage.app",
      messagingSenderId: "213063237801",
      appId: "1:213063237801:web:10134ff68f17229362a9b8"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ========== TAB SWITCHING ==========
    const tabSignin = document.getElementById('tab-signin');
    const tabSignup = document.getElementById('tab-signup');
    const signinForm = document.getElementById('signin-form');
    const signupForm = document.getElementById('signup-form');
    const errorEl = document.getElementById('auth-error');

    tabSignin.addEventListener('click', () => {
      tabSignin.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
      tabSignin.classList.remove('text-gray-500');
      tabSignup.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
      tabSignup.classList.add('text-gray-500');
      signinForm.classList.remove('hidden');
      signupForm.classList.add('hidden');
      errorEl.classList.add('hidden');
    });

    tabSignup.addEventListener('click', () => {
      tabSignup.classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
      tabSignup.classList.remove('text-gray-500');
      tabSignin.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
      tabSignin.classList.add('text-gray-500');
      signupForm.classList.remove('hidden');
      signinForm.classList.add('hidden');
      errorEl.classList.add('hidden');
    });

    // ========== SIGN IN ==========
    signinForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = 'app.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });

    // ========== SIGN UP ==========
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.add('hidden');

      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const role = document.getElementById('signup-role').value;

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Create user profile in Firestore
        await db.collection('users').doc(user.uid).set({
          name,
          email,
          role,               // "client" or "contractor"
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        window.location.href = 'app.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
      }
    });

    // Redirect if already logged in
    auth.onAuthStateChanged((user) => {
      if (user) {
        window.location.href = 'app.html';
      }
    });
  </script>
</body>
</html>
